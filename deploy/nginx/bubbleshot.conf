server {
    listen 80;
    server_name _;

    root /var/www/bubbleshot;
    index index.html;

    # Serve React SPA — all unknown routes fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Reverse-proxy API + Socket.IO to local Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade support (for Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout ajusté pour les WebSockets longue durée
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check endpoint pour Azure Load Balancer probe
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
